# nginx.conf — Servidor estático para o site Nuxt gerado (app-pedro)
# Escuta na porta 82 para não conflitar com a aplicação que já roda na VPS.

server {
    listen 82;
    listen [::]:82;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão para reduzir o tamanho das respostas
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Assets do Nuxt (_nuxt/) têm hash no nome -> cache longo e imutável.
    # Os arquivos existem fisicamente, então não cair no fallback do index.html.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Site estático: tenta o arquivo, a versão .html da rota, depois a pasta;
    # só então cai no index.html. Isso serve corretamente .css/.js/imagens/fontes
    # sem precisar listar extensões, e mantém o roteamento client-side.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # HTML sempre revalidado para pegar a build mais recente
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /index.html;
}
